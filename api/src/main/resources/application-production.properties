spring.config.import=
spring.datasource.url=jdbc:mysql://mysql:3306/taskmanager?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
spring.datasource.username=taskmanager
spring.datasource.password=${MYSQL_PASSWORD}
app.jwt-secret=${JWT_SECRET}
app.code-secret=${CODE_SECRET}
app.resend-api-key=${RESEND_API_KEY}
app.resend-from=${RESEND_FROM}
app.allowed-origins=${ALLOWED_ORIGINS}
app.cookie-secure=true
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
