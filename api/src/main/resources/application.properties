spring.application.name=api
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:${MYSQL_PORT:3307}/${MYSQL_DATABASE:taskmanager}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${MYSQL_USER:taskmanager}
spring.datasource.password=${MYSQL_PASSWORD:localpwd}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
server.forward-headers-strategy=none
spring.web.error.include-message=never
app.jwt-secret=${JWT_SECRET:set-or-replace-with-at-least-32-random-bytes}
app.code-secret=${CODE_SECRET:set-or-replace-with-at-least-32-random-bytes}
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}
app.cookie-secure=${COOKIE_SECURE:true}
app.resend-api-key=${RESEND_API_KEY:}
app.resend-from=${RESEND_FROM:LONTSI <alert@mail.lontsi.app>}
app.resend-base-url=${RESEND_BASE_URL:https://api.resend.com}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
