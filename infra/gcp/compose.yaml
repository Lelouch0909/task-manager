name: taskmanager-preview
services:
  mysql:
    image: mysql:8.0
    mem_limit: 1g
    restart: unless-stopped
    env_file:
      - path: ./mysql.env
        format: raw
    volumes:
      - /var/lib/taskmanager/mysql:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP -h 127.0.0.1 -u taskmanager taskmanager -e "SELECT 1" >/dev/null 2>&1']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    logging: &logging
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  api:
    image: ${API_IMAGE:?API_IMAGE required}
    mem_limit: 1536m
    restart: unless-stopped
    env_file:
      - path: ./api.env
        format: raw
    environment:
      SPRING_PROFILES_ACTIVE: production
      ALLOWED_ORIGINS: https://${DOMAIN:?DOMAIN required}
    depends_on:
      mysql: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, '4', 'http://localhost:8080/actuator/health/readiness']
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    stop_grace_period: 30s
    logging: *logging
  web:
    image: ${WEB_IMAGE:?WEB_IMAGE required}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${DOMAIN:?DOMAIN required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL required}
    ports: ['80:80', '443:443']
    volumes:
      - /var/lib/taskmanager/caddy:/data
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8081/healthz']
      interval: 10s
      timeout: 5s
      retries: 6
    logging: *logging
